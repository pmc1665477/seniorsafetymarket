name: Build and deploy generated pages

on:
  schedule:
    # Every 6 hours — picks up new/sold listings without hammering Hostinger with constant uploads.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build generated pages
        run: npm run build

      # Phase 2 smoke test: deploy to a scoped, currently-unused path on Hostinger
      # (/public_html/staging-check/) to prove the FTP credentials and paths work
      # before Phase 3 points this at the real listing/category/browse output.
      - name: Deploy to Hostinger (staging-check)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/staging-check/
